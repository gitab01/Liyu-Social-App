name: liyu_social
description: "Liyu Social App — a Flutter + Firebase social network for Ethiopian users: feed, stories, real-time messaging and media sharing built for intermittent connections and mid-range phones."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Firebase backend (serverless data, auth, media, push)
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0

  # Media pipeline
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # Local (credential-free) backend + storage
  shared_preferences: ^2.5.0
  path_provider: ^2.1.5

  # Utilities
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
